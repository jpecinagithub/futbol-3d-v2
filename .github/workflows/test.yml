name: test

on:
  push:
  pull_request:

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome
      - run: npm test
        env:
          CHROMIUM_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
      - run: npm run build
